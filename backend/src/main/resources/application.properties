# Datasource comes from SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD env vars.
server.port=${PORT:8080}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Run schema.sql after Hibernate has created/updated the tables.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Neon connections go through PgBouncer, which can hand back server-side prepared statements
# compiled before a schema change ("cached plan must not change result type"). Don't use them.
spring.datasource.hikari.data-source-properties.prepareThreshold=0
